plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"netherfriends" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		configureEach {
			// gradlew runClientGameTest -PnetherTests=Villages runs only the named client tests.
			if (project.hasProperty('netherTests')) {
				vmArg "-Dnetherfriends.tests=${project.property('netherTests')}"
			}
			// -PnetherVillages=hold,vigil photographs only those villages
			if (project.hasProperty('netherVillages')) {
				vmArg "-Dnetherfriends.villages=${project.property('netherVillages')}"
			}
			// -PnetherFilm films the ferry crossing (frames for tools/film_ferry.py)
			if (project.hasProperty('netherFilm')) {
				vmArg "-Dnetherfriends.film=true"
			}
			if (project.hasProperty('seed')) {
				vmArg "-Dnetherfriends.seed=${project.property('seed')}"
			}
			if (project.hasProperty('debugSites')) {
				vmArg "-Dnetherfriends.debugSites=true"
			}
			if (project.hasProperty('testHeap')) {
				vmArg "-Xmx${project.property('testHeap')}"
			}
		}
	}
}

fabricApi {
	configureTests {
		// Client game tests drive the real game and save screenshots: gradlew runClientGameTest
		createSourceSet = true
		modId = "netherfriends-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// gradlew runClientGameTest -PcompatMods=<folder> also loads the mod jars in <folder> (e.g. the VillageFriends
// instance's mods folder), so the tests run inside the real modpack. Fabric API and this mod's own jar are skipped.
def gameTestMods = rootProject.file('build/run/clientGameTest/mods')
tasks.named('runClientGameTest') {
	doFirst {
		delete(fileTree(gameTestMods) { include '*.jar' })
		if (project.hasProperty('compatMods')) {
			copy {
				from(project.property('compatMods')) {
					include '*.jar'
					exclude 'fabric-api*', 'nether-friends*', 'nether-expansion*'
				}
				into gameTestMods
			}
			println "Compat run with: " + fileTree(gameTestMods).files*.name.sort()
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

jar {
	from("LICENSE") {
		rename { "${it}_netherfriends" }
	}
}
